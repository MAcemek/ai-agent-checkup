name: Discussion answers

on:
  discussion:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - id: ai
        uses: actions/ai-inference@v2
        with:
          prompt: 'Answer this question: ${{ github.event.discussion.body }}'
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.MCP_TOKEN }}
