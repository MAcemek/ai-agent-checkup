name: Issue helper

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the author's permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          level=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.issue.user.login }}/permission" --jq .permission)
          if [ "$level" != "admin" ] && [ "$level" != "write" ]; then exit 1; fi

  help:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          settings: '{"tools": {"core": ["run_shell_command(gh issue view)"]}}'
          prompt: Summarize issue ${{ github.event.issue.number }}.
