name: Review on label

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

jobs:
  review:
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: openai/codex-action@0123456789abcdef0123456789abcdef01234567 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          prompt: Review pull request ${{ github.event.pull_request.number }}.
