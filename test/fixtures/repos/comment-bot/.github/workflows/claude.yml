name: Claude

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: anthropics/claude-code-action@v1.0.120
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
