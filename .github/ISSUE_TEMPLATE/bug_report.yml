name: Bug report
description: ai-agent-checkup reported something wrong, missed a problem or crashed.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command you ran and the output or error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: A small workflow that shows the problem. Remove anything private.
      render: yaml
  - type: input
    id: version
    attributes:
      label: ai-agent-checkup version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: How do you run it?
      placeholder: npx on macOS with Node.js 24, or the GitHub Action
